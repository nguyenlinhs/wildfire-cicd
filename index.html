    <!-- Custom Style Sheet -->
    <style>
/* ========================================================
   WILDFIRE AI - CLEAN & STREAMLINED DESIGN SYSTEM
   Tối Giản, Hiện Đại, Trọng Tâm Bản Đồ
   ======================================================== */

:root {
    --bg-dark: #0a0e1a;
    --bg-header: #0f172a;
    --bg-card: rgba(15, 23, 42, 0.88);
    --border-subtle: rgba(255, 255, 255, 0.12);
    --border-highlight: rgba(255, 107, 0, 0.4);

    --primary-fire: #ff6b00;
    --primary-fire-hover: #ff8533;
    --accent-blue: #38bdf8;
    --accent-green: #34d399;
    --accent-red: #ef4444;
    --accent-purple: #c084fc;

    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;

    --font-heading: 'Outfit', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100vw;
    height: 100vh;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: 13px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

.app-layout {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
}

/* ========================================================
   1. TOP HEADER & QUICK CONTROLS
   ======================================================== */
.app-header {
    height: 60px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 1000;
    gap: 16px;
    flex-shrink: 0;
}

.header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-logo {
    font-size: 24px;
}

.brand-text h1 {
    font-family: var(--font-heading);
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.2;
}

.badge-model {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255, 107, 0, 0.15);
    border: 1px solid rgba(255, 107, 0, 0.4);
    color: #ff9944;
}

.brand-text p {
    font-size: 11px;
    color: var(--text-muted);
}

/* Controls Center */
.header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.control-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
}

.select-fire {
    background: #1e293b;
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    color: #fff;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    min-width: 250px;
}

.select-fire:focus {
    border-color: var(--primary-fire);
}

.upload-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn-secondary {
    background: #1e293b;
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
}

.btn-secondary:hover {
    background: #334155;
    border-color: var(--border-highlight);
}

.upload-filename {
    font-size: 11px;
    color: var(--accent-blue);
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.btn-predict-main {
    background: var(--primary-fire);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 12px rgba(255, 107, 0, 0.4);
    transition: all 0.2s;
    white-space: nowrap;
}

.btn-predict-main:hover {
    background: var(--primary-fire-hover);
    transform: translateY(-1px);
    box-shadow: 0 0 16px rgba(255, 107, 0, 0.6);
}

.btn-predict-main:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* Header Summary Stats */
.header-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(30, 41, 59, 0.5);
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-subtle);
}

.summary-stat {
    display: flex;
    align-items: baseline;
    gap: 6px;
}

.stat-lbl {
    font-size: 11px;
    color: var(--text-muted);
}

.stat-val {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
}

.blue-text { color: var(--accent-blue); }
.fire-text { color: var(--primary-fire); }
.green-text { color: var(--accent-green); }

.stat-pct {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-red);
}

.summary-arrow {
    color: var(--text-dim);
    font-size: 11px;
}

.risk-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--accent-red);
    color: #fff;
    letter-spacing: 0.5px;
}

/* ========================================================
   2. MAIN MAP CONTAINER
   ======================================================== */
.map-container {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
}

.map-canvas {
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Floating Card on Map (Top-Left) */
.map-floating-card {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 400;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 14px 18px;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 320px;
    max-width: 380px;
}

.fire-name {
    font-family: var(--font-heading);
    font-size: 15px;
    font-weight: 700;
    color: #fff;
}

.fire-sub {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    margin-top: 2px;
}

/* Layer Toggle Buttons */
.layer-control-row {
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border-subtle);
    padding-top: 8px;
}

.layer-toggle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    background: rgba(30, 41, 59, 0.6);
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-subtle);
    transition: all 0.2s;
}

.layer-toggle-btn:hover {
    background: rgba(30, 41, 59, 1);
    border-color: var(--border-highlight);
}

.color-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.blue-dot { background: var(--accent-blue); box-shadow: 0 0 6px var(--accent-blue); }
.fire-dot { background: var(--primary-fire); box-shadow: 0 0 6px var(--primary-fire); }

/* Opacity Slider Row */
.slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--text-muted);
}

.opacity-slider {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    background: #334155;
    border-radius: 2px;
    outline: none;
}

.opacity-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--primary-fire);
    cursor: pointer;
}

.opacity-val {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-main);
    min-width: 28px;
}

/* Quick Metrics Row */
.quick-metrics-row {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--border-subtle);
    padding-top: 8px;
    font-size: 11px;
}

.qm-item {
    display: flex;
    gap: 5px;
}

.qm-label {
    color: var(--text-muted);
}

.qm-val {
    font-weight: 600;
    font-family: var(--font-mono);
}

/* Floating Button to open 4 Scientific Images (Top-Right) */
.btn-open-evaluation {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 400;
    background: var(--bg-card);
    border: 1px solid var(--border-highlight);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(16px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
}

.btn-open-evaluation:hover {
    background: var(--primary-fire);
    border-color: var(--primary-fire);
    box-shadow: 0 0 16px rgba(255, 107, 0, 0.5);
    transform: translateY(-1px);
}

/* Pulse Marker on GIS Map */
.hotspot-pulse-marker {
    position: relative;
    width: 18px;
    height: 18px;
}

.hotspot-pulse-marker::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 12px #ef4444;
}

.hotspot-pulse-marker::after {
    content: '';
    position: absolute;
    width: 240%;
    height: 240%;
    top: -70%;
    left: -70%;
    border-radius: 50%;
    border: 2px solid #ff7700;
    animation: pulseRing 1.8s infinite ease-out;
}

@keyframes pulseRing {
    0% { transform: scale(0.3); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
}

/* ========================================================
   3. MODAL: 4 SCIENTIFIC EVALUATION VIEWS
   ======================================================== */
.eval-modal {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
}

.eval-modal.open {
    display: flex;
}

.modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
}

.modal-card {
    position: relative;
    z-index: 10;
    width: 90vw;
    max-width: 960px;
    max-height: 90vh;
    background: #0f172a;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(30, 41, 59, 0.5);
}

.modal-header h2 {
    font-family: var(--font-heading);
    font-size: 16px;
    font-weight: 700;
    color: #fff;
}

.modal-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
}

.btn-close-modal {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
}

.btn-close-modal:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
}

.modal-grid {
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    overflow-y: auto;
}

.grid-card {
    background: #090d16;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    overflow: hidden;
}

.grid-title {
    padding: 8px 12px;
    background: rgba(30, 41, 59, 0.6);
    border-bottom: 1px solid var(--border-subtle);
    font-size: 11px;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
}

.tag {
    font-size: 9px;
    font-weight: 800;
    font-family: var(--font-mono);
    padding: 1px 6px;
    border-radius: 3px;
}

.blue-tag { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
.fire-tag { background: rgba(255, 107, 0, 0.2); color: #ff9944; }
.green-tag { background: rgba(52, 211, 153, 0.2); color: #34d399; }
.purple-tag { background: rgba(192, 132, 252, 0.2); color: #c084fc; }

.grid-img-wrap {
    width: 100%;
    aspect-ratio: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.grid-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.modal-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border-subtle);
    background: rgba(30, 41, 59, 0.5);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.footer-metrics {
    display: flex;
    gap: 16px;
    font-size: 12px;
}

.fm-box span {
    font-family: var(--font-mono);
    color: var(--primary-fire);
}

.btn-done {
    background: #334155;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.2s;
}

.btn-done:hover {
    background: #475569;
}

</style>
</head>

    <div class="app-layout">
        
        <!-- 1. TOP HEADER & QUICK CONTROLS (TẤT CẢ TRÊN 1 DÒNG GỌN GÀNG) -->
        <header class="app-header">
            <div class="header-brand">
                <span class="brand-logo">🔥</span>
                <div class="brand-text">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
/**
 * ========================================================
 * WILDFIRE AI - STREAMLINED LOGIC
 * Tối giản, tập trung vào bản đồ và dự báo
 * ========================================================
 */

// Global State
let selectedFire = "Smith_River_Complex_CA_2023.hdf5";
let uploadedFile = null;
let currentData = null;
let isPredicted = false;

// Map & Layer References
let map = null;
let inputLayer = null;
let predLayer = null;
let epicenterMarker = null;
let currentBounds = null;

// High-Res Esri Satellite Layer
const SATELLITE_TILE = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const SATELLITE_ATTR = "Tiles &copy; Esri &mdash; VIIRS / MODIS Fire Response";

// Preset Fire Historical Dates
const FIRE_DATES = {
    "Smith_River_Complex_CA_2023.hdf5": "20-08",
    "Mosquito_Fire_CA_2022.hdf5": "10-09",
    "Rabbit_Fire_CA_2023.hdf5": "15-07",
    "Black_Fire_NM_2022.hdf5": "18-05",
    "Wildcat_Fire_AZ_2023.hdf5": "02-07",
    "Bedrock_Fire_OR_2023.hdf5": "28-07",
    "Calf_Canyon_Fire_NM_2022.hdf5": "16-04",
    "Hermits_Peak_Fire_NM_2022.hdf5": "20-04",
    "Lookout_Fire_OR_2023.hdf5": "15-08",
    "Yosemite_Complex_CA.hdf5": "06-10",
    "Six_Rivers_Fire_CA.hdf5": "13-09",
    "Happy_Camp_Complex_CA.hdf5": "12-09",
    "Colt_Fire_MT.hdf5": "17-08",
    "Pine_Pond_Fire_TX.hdf5": "28-09"
};

// ========================================================
// 1. INITIALIZATION ON DOM READY
// ========================================================
document.addEventListener("DOMContentLoaded", async () => {
    initMap();
    bindEvents();
    await loadInitialData();
});

function initMap() {
    const defaultCenter = [41.788, -123.788];
    const defaultZoom = 12;

    map = L.map('map', {
        center: defaultCenter,
        zoom: defaultZoom,
        zoomControl: true,
        attributionControl: false
    });

    L.tileLayer(SATELLITE_TILE, {
        maxZoom: 18,
        attribution: SATELLITE_ATTR
    }).addTo(map);

    const pulseIcon = L.divIcon({
        className: 'hotspot-pulse-marker',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
    });

    epicenterMarker = L.marker(defaultCenter, { icon: pulseIcon }).addTo(map);
}

// ========================================================
// 2. DATA LOADING & UI SYNC
// ========================================================
async function loadInitialData() {
    try {
        const res = await fetch('/wf_api/initial_data');
        if (res.ok) {
            const data = await res.json();
            if (data && data.success) {
                updateUI(data, false);
                return;
            }
        }
    } catch (e) {
        console.warn("Could not fetch initial data:", e);
    }
    await fetchFireFootprint(selectedFire, false);
}

async function fetchFireFootprint(fireKey, andPredict = false) {
    try {
        const targetDate = FIRE_DATES[fireKey] || "20-08";
        const res = await fetch('/wf_api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fire_key: fireKey,
                days: 5,
                date: targetDate
            })
        });
        const data = await res.json();
        updateUI(data, andPredict);
    } catch (err) {
        console.error("Lỗi khi tải dữ liệu đám cháy:", err);
    }
}

function updateUI(data, isPredictedTriggered = false) {
    if (!data || !data.success) {
        const errMsg = data && data.error ? data.error : (data && data.detail ? JSON.stringify(data.detail) : "Không có phản hồi từ máy chủ");
        alert("Lỗi khi tải dữ liệu dự báo: " + errMsg);
        return;
    }

    currentData = data;
    isPredicted = isPredictedTriggered;
    const lat = data.lat || 41.788;
    const lng = data.lng || -123.788;
    const delta = 0.075;
    currentBounds = data.bounds || [[lat - delta, lng - delta], [lat + delta, lng + delta]];

    const initHa = (data.area_init || 0).toLocaleString();
    const predHa = (data.area_pred || 0).toLocaleString();

    // 1. Header Summary Stats
    const headerInitEl = document.getElementById('header-init-area');
    const headerPredEl = document.getElementById('header-pred-area');
    const headerPctEl = document.getElementById('header-pct-change');
    const headerBadgeEl = document.getElementById('header-risk-badge');

    if (headerInitEl) headerInitEl.innerText = `${initHa} ha`;

    if (isPredictedTriggered) {
        if (headerPredEl) {
            headerPredEl.innerText = `${predHa} ha`;
            headerPredEl.style.color = "#ff6b00";
            headerPredEl.style.fontWeight = "700";
        }
        if (headerPctEl) headerPctEl.innerText = `(${data.pct_change || "+0%"})`;
        if (headerBadgeEl) {
            headerBadgeEl.innerText = data.risk_badge || "KHẨN CẤP";
            headerBadgeEl.style.backgroundColor = data.risk_color || "#ef4444";
        }
    } else {
        if (headerPredEl) {
            headerPredEl.innerText = "Chờ dự báo...";
            headerPredEl.style.color = "#94a3b8";
            headerPredEl.style.fontWeight = "500";
        }
        if (headerPctEl) headerPctEl.innerText = "";
        if (headerBadgeEl) {
            headerBadgeEl.innerText = "CHỜ DỰ BÁO";
            headerBadgeEl.style.backgroundColor = "#475569";
        }
    }

    // 2. Map Floating Card
    const nameEl = document.getElementById('info-fire-name');
    const subEl = document.getElementById('info-coords-date');
    const riskEl = document.getElementById('info-risk-level');
    const statusEl = document.getElementById('info-status-text');

    if (nameEl) nameEl.innerText = data.name || "Đám cháy thực tế";
    if (subEl) subEl.innerText = `📍 ${data.coords || `${lat}° N, ${lng}° W`} • Quan sát vệ tinh gần nhất`;

    if (riskEl) {
        if (isPredictedTriggered) {
            riskEl.innerText = data.risk_badge || "Khẩn cấp";
            riskEl.style.color = data.risk_color || "#ef4444";
        } else {
            riskEl.innerText = "Chờ dự báo";
            riskEl.style.color = "#94a3b8";
        }
    }
    if (statusEl) {
        statusEl.innerText = isPredictedTriggered ? "Đã dự báo lan truyền" : "Sẵn sàng dự báo";
    }

    // 3. Map View & Marker
    map.setView([lat, lng], 12);
    epicenterMarker.setLatLng([lat, lng]);

    const opacitySlider = document.getElementById('slider-opacity');
    const currentOpacity = opacitySlider ? parseFloat(opacitySlider.value) : 0.85;

    // Layer 1: Vết cháy hiện tại
    if (inputLayer) map.removeLayer(inputLayer);
    const inputSrc = data.leaflet_input || data.input_img || data.img_t5;
    if (inputSrc) {
        inputLayer = L.imageOverlay(inputSrc, currentBounds, { opacity: currentOpacity });
        if (document.getElementById('chk-layer-init')?.checked) {
            inputLayer.addTo(map);
        }
    }

    // Layer 2: AI Dự báo lan truyền (CHỈ HIỂN THỊ KHI BẮT ĐẦU CHẠY DỰ BÁO)
    if (predLayer) map.removeLayer(predLayer);
    const predSrc = data.leaflet_pred || data.pred_img || data.img_pred;
    const chkPred = document.getElementById('chk-layer-pred');
    if (predSrc) {
        predLayer = L.imageOverlay(predSrc, currentBounds, { opacity: currentOpacity });
        if (isPredictedTriggered) {
            if (chkPred) chkPred.checked = true;
            predLayer.addTo(map);
        } else {
            if (chkPred) chkPred.checked = false;
        }
    }
}

// ========================================================
// 3. EVENT LISTENERS
// ========================================================
function bindEvents() {
    // 1. Fire Selection Dropdown
    const select = document.getElementById('select-fire');
    if (select) {
        select.addEventListener('change', async (e) => {
            selectedFire = e.target.value;
            uploadedFile = null;
            currentData = null;
            const uploadText = document.getElementById('upload-status-text');
            if (uploadText) uploadText.innerText = "";
            if (fileInput) fileInput.value = "";
            // Hiển thị vết cháy hiện tại của đám cháy mới, CHƯA hiện dự báo lan truyền
            await fetchFireFootprint(selectedFire, false);
        });
    }

    // 2. File Upload Button
    const uploadTrigger = document.getElementById('btn-upload-trigger');
    const fileInput = document.getElementById('file-input');
    if (uploadTrigger && fileInput) {
        uploadTrigger.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (e) => {
            if (e.target.files && e.target.files.length > 0) {
                uploadedFile = e.target.files[0];
                const uploadText = document.getElementById('upload-status-text');
                if (uploadText) uploadText.innerText = `⏳ Đang đọc tệp ${uploadedFile.name}...`;

                try {
                    const formData = new FormData();
                    formData.append('file', uploadedFile);
                    formData.append('days', 5);

                    const res = await fetch('/wf_api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data && data.success) {
                        currentData = data;
                        if (uploadText) uploadText.innerText = `📄 ${uploadedFile.name}`;
                        // CHỈ HIỂN THỊ VẾT CHÁY HIỆN TẠI, CHƯA HIỂN THỊ LAN TRUYỀN DỰ BÁO
                        updateUI(data, false);
                    } else {
                        if (uploadText) uploadText.innerText = "❌ Lỗi đọc tệp";
                        alert("Lỗi khi đọc tệp: " + (data ? data.error : "Không thể xử lý dữ liệu"));
                    }
                } catch (err) {
                    if (uploadText) uploadText.innerText = "❌ Lỗi tải lên";
                    alert("Lỗi kết nối khi tải tệp: " + err);
                }
            }
        });
    }

    // 3. Main Predict Button
    const btnPredict = document.getElementById('btn-predict');
    if (btnPredict) {
        btnPredict.addEventListener('click', executePredict);
    }

    // 4. Layer Checkboxes
    const chkInit = document.getElementById('chk-layer-init');
    const chkPred = document.getElementById('chk-layer-pred');

    if (chkInit) {
        chkInit.addEventListener('change', (e) => {
            if (!inputLayer) return;
            if (e.target.checked) inputLayer.addTo(map);
            else map.removeLayer(inputLayer);
        });
    }

    if (chkPred) {
        chkPred.addEventListener('change', (e) => {
            if (!predLayer) return;
            if (e.target.checked) predLayer.addTo(map);
            else map.removeLayer(predLayer);
        });
    }

    // 5. Opacity Slider
    const opacitySlider = document.getElementById('slider-opacity');
    const opacityVal = document.getElementById('opacity-val');
    if (opacitySlider) {
        opacitySlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (opacityVal) opacityVal.innerText = `${Math.round(val * 100)}%`;
            if (inputLayer) inputLayer.setOpacity(val);
            if (predLayer) predLayer.setOpacity(val);
        });
    }
}

// ========================================================
// 4. API PREDICTION EXECUTION
// ========================================================
async function executePredict() {
    const btn = document.getElementById('btn-predict');
    if (!btn) return;

    const originalText = btn.innerHTML;
    btn.innerHTML = `<span>⏳ Đang tính toán lan truyền...</span>`;
    btn.disabled = true;

    try {
        if (currentData) {
            // Đã có dữ liệu đám cháy (từ tải tệp hoặc chọn sẵn)
            // Mô phỏng AI tính toán và KÍCH HOẠT HIỂN THỊ DỰ BÁO LAN TRUYỀN (true)
            await new Promise(r => setTimeout(r, 600));
            updateUI(currentData, true);
        } else {
            const targetDate = FIRE_DATES[selectedFire] || "20-08";
            const res = await fetch('/wf_api/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fire_key: selectedFire,
                    days: 5,
                    date: targetDate
                })
            });
            const data = await res.json();
            updateUI(data, true);
        }
    } catch (err) {
        console.error("Lỗi khi chạy dự báo:", err);
        alert("Lỗi kết nối máy chủ: " + err);
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}
